id: vat_invoice_first_time
suite: capability
source: spec:vat-invoices
description: first_time customer, vat invoice.
input:
  persona: first_time
  from: office@clearwaterdental.com
  message: Can invoices show a VAT number? Our bookkeeper is asking.
  goal: VAT invoices pull the registered company name and VAT number from the
    account profile
reference_solution: refs/vat_invoice_first_time.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.count: 0
      confirmations.sent: 1
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 6
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - vat_invoice
  - first_time
