id: goodwill_credit_business
suite: capability
source: spec:goodwill-credit
description: business customer, refund outside window.
input:
  persona: business
  from: hana@sato.jp
  message: Requesting a refund of the July and August invoices; the service was
    not used.
  goal: I checked both invoices
reference_solution: refs/goodwill_credit_business.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.count: 0
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 5
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - refund_outside_window
  - business
