id: first_month_howto_first_time
suite: capability
source: spec:onboarding
description: first_time customer, first month howto.
input:
  persona: first_time
  from: ren.ito@outlook.com
  message: Just signed up! How do I upgrade later if I need to?
  goal: Plan changes live under Settings, then Billing, then Change plan
reference_solution: refs/first_month_howto_first_time.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.count: 0
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 3
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - first_month_howto
  - first_time
