id: cancel_monthly_business
suite: capability
source: spec:cancellation
description: "business customer, cancel monthly. Capability: the agent has no
  cancellation tool yet, so this cannot pass until one ships."
input:
  persona: business
  from: tomas@lindqvist.se
  message: Please cancel the subscription at the end of the current period and
    confirm whether the current month is refundable.
  goal: I've cancelled the subscription; there will be no further charges
reference_solution: refs/cancel_monthly_business.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.count: 0
      tickets.status: resolved
      confirmations.sent: 1
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 6
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - cancel_monthly
  - business
