id: retry_now_business
suite: capability
source: spec:retry-now
description: business customer, failed payment.
input:
  persona: business
  from: jonah.feld@gmail.com
  message: We received a failed-payment notice for 12 October. What is the retry
    schedule?
  goal: The 12 October charge of $19
reference_solution: refs/retry_now_business.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.count: 0
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 5
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - failed_payment
  - business
