id: refund_batch_business
suite: capability
source: spec:refund-batch
description: business customer, duplicate charge.
input:
  persona: business
  from: maya@okafor.dev
  message: Our card shows two $19.99 charges dated 1 October. Please refund the
    duplicate.
  goal: I'm sorry about the double charge
reference_solution: refs/refund_batch_business.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.status: processed
      refunds.amount_cents: 1999
      confirmations.sent: 1
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: confirmed
    type: code
    fn: graders/code/confirmation_sent.py
    weight: 1
    failure_mode: skipped_confirmation
  - id: missed_refund
    type: judge
    failure_mode: missed_refund
    weight: 2
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 6
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - duplicate_charge
  - business
