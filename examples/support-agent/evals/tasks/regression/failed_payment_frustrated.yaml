id: failed_payment_frustrated
suite: regression
source: trace:tr_0037
description: frustrated customer, failed payment.
input:
  persona: frustrated
  from: jonah.feld@gmail.com
  message: Your email says my payment failed and I'll lose access. My card is
    fine. What is going on?
  goal: The 12 October charge of $19
reference_solution: refs/failed_payment_frustrated.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.count: 0
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 5
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - failed_payment
  - frustrated
