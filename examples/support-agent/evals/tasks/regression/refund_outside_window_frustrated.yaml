id: refund_outside_window_frustrated
suite: regression
source: trace:tr_0020
description: frustrated customer, refund outside window.
input:
  persona: frustrated
  from: hana@sato.jp
  message: I want my July and August payments back. I barely used the thing.
  goal: I checked both invoices
reference_solution: refs/refund_outside_window_frustrated.json
trials: 5
checks:
  - id: end_state
    type: outcome
    backend: sql
    expect:
      refunds.count: 0
    weight: 3
  - id: identity_first
    type: code
    fn: graders/code/identity_verified_first.py
    weight: 2
    failure_mode: identity_leak
  - id: bounded
    type: transcript
    path_check: true
    max_toolcalls: 5
    required_tools:
      - verify_identity
    failure_mode: over_searching
  - id: tone
    type: judge
    failure_mode: tone_mismatch
    weight: 1
report:
  - strict_pass
  - weighted_score
  - pass_at_k
  - pass_hat_k
tags:
  - refund_outside_window
  - frustrated
